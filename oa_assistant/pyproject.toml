[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oa-assistant"
version = "0.1.0"
description = "A Windows desktop AI assistant for learning OS-level programming and AI integration"
readme = "README.md"
requires-python = ">=3.12"
license = "Proprietary"
authors = [
    {name = "Your Name"}
]
dependencies = [
    "PySide6>=6.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/oa-assistant"

[project.scripts]
oa-assistant = "oa_assistant.app.main:main"

[tool.setuptools.packages]
find = {where = ["."], include = ["oa_assistant"]}